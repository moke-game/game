syntax = "proto3";

package game0.pb;
option go_package = "game0/api;pb";

service Game0Service {
  rpc Hi (HiRequest) returns (HiResponse) {};
  rpc Watch(WatchRequest) returns (stream WatchResponse) {};
}

message HiRequest {
  string uid = 1;
  string message = 2;
  string topic = 3;
}

message HiResponse {
  string message = 1;
}

message WatchRequest {
  string uid = 1;
  string topic = 2;
}

message WatchResponse {
  string message = 1;
}
